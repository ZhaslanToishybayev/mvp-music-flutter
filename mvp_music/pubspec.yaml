name: mvp_music
description: MVP Music App with Flutter - Music player with iTunes API, audio visualizer, synchronized lyrics, playlists and favorites

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.5
  
  # Audio
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.16
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP
  dio: ^5.4.0
  
  # UI
  cached_network_image: ^3.3.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  
  # Lyrics (will implement custom parser)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/